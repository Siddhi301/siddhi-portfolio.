const { useState } = React;

function CopyField({ icon, value, display, href }) {
  const [copied, setCopied] = useState(false);

  const handleCopy = async (e) => {
    e.preventDefault();
    try {
      await navigator.clipboard.writeText(value);
      setCopied(true);
      setTimeout(() => setCopied(false), 1600);
    } catch (err) {
      window.location.href = href;
    }
  };

  return (
    <button
      onClick={handleCopy}
      className="copy-btn inline-flex items-center gap-1.5 text-sm text-[#9aa1b5] hover:text-[#f1f2f6]"
      title={`Copy ${display}`}
    >
      <span aria-hidden="true">{icon}</span>
      <span className="underline decoration-[#262b3d] underline-offset-2">
        {copied ? "Copied!" : display}
      </span>
    </button>
  );
}

function StoreRow({ name, url, desc, status }) {
  return (
    <div className="stub-row flex items-start justify-between gap-4 py-3 px-1 -mx-1 rounded">

        <a
          href={url}
          target="_blank"
          rel="noopener noreferrer"
          className="underline-link font-medium text-[#f1f2f6]"

          {name}
        </a>
        {desc && (
          <p className="text-sm text-[#9aa1b5] mt-1 max-w-md">{desc}</p>
        )}
      </div>
      <span className="text-xs text-[#7ea6ee] whitespace-nowrap pt-1">{status}</span>
    </div>
  );
}

function Tag({ children }) {
  return (
    <span className="tag-chip inline-block px-3 py-1.5 rounded-sm text-sm bg-[#1b2136] text-[#7ea6ee]">
      {children}

}
